<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Coverage and priority ledger wireframe</title>
  <desc id="desc">Required source health and append-only priority decisions shown together.</desc>
  <rect width="1440" height="960" fill="#f5f1e8"/>
  <text x="82" y="100" fill="#17231f" font-family="system-ui" font-size="36" font-weight="700">Coverage</text>
  <rect x="82" y="135" width="602" height="700" rx="20" fill="#fff" stroke="#d7d0c3"/>
  <rect x="112" y="169" width="542" height="72" rx="12" fill="#fbe9df"/><text x="136" y="198" fill="#8b3d22" font-family="system-ui" font-size="16" font-weight="700">All-clear withheld</text><text x="136" y="223" fill="#6d5146" font-family="system-ui" font-size="14">1 required source needs permission</text>
  <g font-family="system-ui"><text x="122" y="294" fill="#17231f" font-size="17" font-weight="700">Mailboxes</text><text x="550" y="294" fill="#28724f" font-size="15">Fresh</text><text x="122" y="348" fill="#17231f" font-size="17" font-weight="700">Calendars</text><text x="550" y="348" fill="#28724f" font-size="15">Fresh</text><text x="122" y="402" fill="#17231f" font-size="17" font-weight="700">Slack workspace</text><text x="550" y="402" fill="#b26a24" font-size="15">Partial</text><text x="122" y="456" fill="#17231f" font-size="17" font-weight="700">Teams tenant</text><text x="550" y="456" fill="#28724f" font-size="15">Fresh</text><text x="122" y="510" fill="#17231f" font-size="17" font-weight="700">Meeting notes</text><text x="550" y="510" fill="#28724f" font-size="15">Fresh</text><text x="122" y="564" fill="#17231f" font-size="17" font-weight="700">Messages</text><text x="477" y="564" fill="#9d3e36" font-size="15">Permission denied</text></g>
  <rect x="112" y="612" width="542" height="168" rx="12" fill="#fbfaf7" stroke="#d7d0c3"/><text x="136" y="650" fill="#17231f" font-family="system-ui" font-size="17" font-weight="700">Messages recovery</text><text x="136" y="682" fill="#53625c" font-family="system-ui" font-size="14">Last good: none · required for all-clear</text><text x="136" y="710" fill="#53625c" font-family="system-ui" font-size="14">Grant Full Disk Access to the read-only helper,</text><text x="136" y="736" fill="#53625c" font-family="system-ui" font-size="14">then run a bounded initial collection.</text>
  <text x="752" y="100" fill="#17231f" font-family="system-ui" font-size="36" font-weight="700">Priority Ledger</text>
  <rect x="752" y="135" width="606" height="700" rx="20" fill="#fff" stroke="#d7d0c3"/>
  <text x="788" y="184" fill="#53625c" font-family="system-ui" font-size="15">Active rules v4 · judgment policy v2</text>
  <line x1="812" y1="232" x2="812" y2="744" stroke="#cad4cf" stroke-width="3"/>
  <circle cx="812" cy="270" r="9" fill="#284c40"/><text x="842" y="263" fill="#17231f" font-family="system-ui" font-size="17" font-weight="700">Ranked primary-work first</text><text x="842" y="291" fill="#53625c" font-family="system-ui" font-size="14">Comparable due time and consequence · rule domain-1</text>
  <circle cx="812" cy="390" r="9" fill="#9d4d28"/><text x="842" y="383" fill="#17231f" font-family="system-ui" font-size="17" font-weight="700">Urgency override</text><text x="842" y="411" fill="#53625c" font-family="system-ui" font-size="14">Side-project item due in 1 hour · severe consequence</text>
  <circle cx="812" cy="510" r="9" fill="#6b7890"/><text x="842" y="503" fill="#17231f" font-family="system-ui" font-size="17" font-weight="700">Correction proposed</text><text x="842" y="531" fill="#53625c" font-family="system-ui" font-size="14">No ordering change until exact approval</text>
  <circle cx="812" cy="630" r="9" fill="#28724f"/><text x="842" y="623" fill="#17231f" font-family="system-ui" font-size="17" font-weight="700">Rules v4 approved</text><text x="842" y="651" fill="#53625c" font-family="system-ui" font-size="14">Prior versions and evaluations remain replayable</text>
  <rect x="788" y="708" width="534" height="82" rx="12" fill="#e8f0ed"/><text x="812" y="742" fill="#284c40" font-family="system-ui" font-size="15">Every decision has inputs, result, reason, and version.</text><text x="812" y="770" fill="#53625c" font-family="system-ui" font-size="14">Ledger is append-only and safe to inspect.</text>
</svg>
