<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Multi-source Tend card wireframe</title>
  <desc id="desc">One commitment card with source receipts, editable reply, card chat, and an exact approval action.</desc>
  <rect width="1440" height="960" fill="#f5f1e8"/>
  <text x="92" y="105" fill="#17231f" font-family="system-ui" font-size="36" font-weight="700">One obligation, one card</text>
  <rect x="92" y="146" width="828" height="724" rx="20" fill="#fff" stroke="#d7d0c3"/>
  <text x="128" y="194" fill="#9d4d28" font-family="system-ui" font-size="14" font-weight="700">OPEN · DUE FRIDAY</text>
  <text x="128" y="242" fill="#17231f" font-family="system-ui" font-size="28" font-weight="700">Send the revised launch brief</text>
  <text x="128" y="280" fill="#53625c" font-family="system-ui" font-size="16">Explicit promise · owner primary-work</text>
  <text x="128" y="332" fill="#17231f" font-family="system-ui" font-size="18" font-weight="700">Evidence receipts</text>
  <rect x="128" y="354" width="348" height="92" rx="12" fill="#e8f0ed"/><text x="150" y="385" fill="#284c40" font-family="system-ui" font-size="15" font-weight="700">Meeting note</text><text x="150" y="415" fill="#53625c" font-family="system-ui" font-size="14">Explicit first-person promise · 10:42</text>
  <rect x="494" y="354" width="348" height="92" rx="12" fill="#eef0f4"/><text x="516" y="385" fill="#3f5364" font-family="system-ui" font-size="15" font-weight="700">Email follow-up</text><text x="516" y="415" fill="#53625c" font-family="system-ui" font-size="14">Same deliverable · 14:18</text>
  <text x="128" y="498" fill="#17231f" font-family="system-ui" font-size="18" font-weight="700">Suggested reply</text>
  <rect x="128" y="520" width="714" height="142" rx="12" fill="#fbfaf7" stroke="#d7d0c3"/><text x="150" y="555" fill="#53625c" font-family="system-ui" font-size="15">Thanks — I’ll send the revised brief by Friday.</text><text x="150" y="590" fill="#53625c" font-family="system-ui" font-size="15">I’ll include the updated launch sequence and owners.</text>
  <rect x="128" y="692" width="240" height="48" rx="10" fill="#17231f"/><text x="162" y="722" fill="#fff" font-family="system-ui" font-size="15">Approve exact send reply</text>
  <text x="128" y="777" fill="#53625c" font-family="system-ui" font-size="14">Assurance: agent host observed · edits require reapproval</text>
  <rect x="956" y="146" width="392" height="724" rx="20" fill="#17231f"/>
  <text x="990" y="194" fill="#fff" font-family="system-ui" font-size="20" font-weight="700">Card conversation</text>
  <rect x="990" y="235" width="324" height="130" rx="14" fill="#263630"/><text x="1012" y="270" fill="#d7e3de" font-family="system-ui" font-size="15">Why is this first?</text><text x="1012" y="310" fill="#aebdb7" font-family="system-ui" font-size="14">Due Friday, high consequence, and</text><text x="1012" y="335" fill="#aebdb7" font-family="system-ui" font-size="14">the primary-work rule applies.</text>
  <rect x="990" y="692" width="324" height="104" rx="12" fill="#fff"/><text x="1012" y="730" fill="#68766f" font-family="system-ui" font-size="14">Ask or instruct this card…</text>
  <rect x="1190" y="813" width="124" height="38" rx="9" fill="#d9a56f"/><text x="1227" y="838" fill="#17231f" font-family="system-ui" font-size="14">Send</text>
</svg>
